aid: wonolo
name: Wonolo
description: 'Wonolo is an on-demand staffing marketplace, founded in 2013 and headquartered
  in San Francisco, that connects businesses needing flexible frontline labor with a
  pool of vetted independent workers ("Wonoloers") for warehousing, manufacturing, food
  production, retail, hospitality and general labor jobs. Businesses post job requests
  and are matched to available workers in real time without resumes or interviews, for
  one-off, ongoing and temp-to-hire needs. Wonolo operates a REST integration API (V2)
  on api.wonolo.com that lets customers create and manage job requests, jobs, workers
  and users programmatically and receive webhook callbacks, so scheduling, timekeeping,
  HR and CRM systems can be wired directly into the staffing platform.'
