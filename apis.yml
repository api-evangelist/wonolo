apis:
- aid: wonolo:wonolo-api-v2
  name: Wonolo API V2
  description: 'The Wonolo API V2 is a RESTful, JSON-only integration API for the Wonolo
    on-demand staffing platform. It performs CRUD operations against platform resources
    — Users (both Workers/Wonoloers and Employers/Requesters), Job Requests (a unit of
    work to be staffed) and Jobs (an individual worker''s assignment against a request)
    — and supports webhook callbacks so a customer system can track resource state
    changes. Callers authenticate by exchanging an issued api_key and secret_key for a
    token at /api_v2/authenticate and pass that token on subsequent calls. API keys are
    issued at one of two access levels: Public Pool (read-oriented access to Wonolo''s
    public worker pool) and Private Pool (for companies managing their own worker pool),
    with write operations restricted at the Public Pool level.'
  humanURL: https://www.wonolo.com/businesses
  baseURL: https://api.wonolo.com/api_v2/
